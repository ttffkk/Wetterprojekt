<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DWD Weather Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #3b82f6;
            --accent-color: #60a5fa;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --card-hover-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .hero-section {
            background: var(--bg-gradient);
            color: white;
            padding: 4rem 0 3rem;
            margin-bottom: 3rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .hero-title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .hero-subtitle {
            font-size: 1.2rem;
            opacity: 0.95;
        }

        .section-card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            margin-bottom: 3rem;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            border: none;
        }

        .section-card:hover {
            box-shadow: var(--card-hover-shadow);
            transform: translateY(-5px);
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 2rem;
            background: var(--bg-gradient);
            border-radius: 2px;
        }

        .form-label {
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.5rem;
        }

        .form-control, .form-select {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn-primary {
            background: var(--bg-gradient);
            border: none;
            border-radius: 12px;
            padding: 0.875rem 2rem;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .spinner-border {
            width: 3rem;
            height: 3rem;
            border-width: 0.3rem;
        }

        .loading-text {
            margin-top: 1rem;
            font-size: 1.1rem;
            color: #64748b;
        }

        .result-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            border: 2px solid #e2e8f0;
        }

        .result-card .card-header {
            background: var(--bg-gradient);
            color: white;
            padding: 1.25rem;
            font-weight: 600;
            font-size: 1.15rem;
        }

        .list-group-item {
            border: none;
            border-bottom: 1px solid #f1f5f9;
            padding: 1rem 1.5rem;
            transition: background 0.2s ease;
        }

        .list-group-item:hover {
            background: #f8fafc;
        }

        .list-group-item:last-child {
            border-bottom: none;
        }

        .alert {
            border-radius: 12px;
            border: none;
            padding: 1rem 1.5rem;
        }

        .alert-success {
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
            color: #065f46;
        }

        .alert-danger {
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="hero-section">
        <div class="container text-center">
            <h1 class="hero-title">🌤️ DWD Weather Analysis</h1>
            <p class="hero-subtitle">Simple weather data for Germany</p>
        </div>
    </div>

    <div class="container">
        <div class="section-card">
            <h2 class="section-title">Weather Query</h2>
            <form id="weather-form">
                <div class="mb-3">
                    <label for="location" class="form-label">Location (Address in Germany)</label>
                    <input type="text" class="form-control" id="location" name="location" placeholder="e.g., Berlin, Hamburg, Munich" required>
                </div>
                <div class="mb-4">
                    <label for="date" class="form-label">Date</label>
                    <input type="date" class="form-control" id="date" name="date" required>
                </div>
                <button type="submit" class="btn btn-primary">Get Weather Data</button>
            </form>

            <div id="loading-spinner" class.text-center d-none mt-4">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="loading-text">Fetching weather data...</p>
            </div>

            <div id="weather-results" class="mt-4"></div>
        </div>
    </div>

    <div style="height: 80px;"></div>

    <script>
        document.getElementById('weather-form').addEventListener('submit', async function(event) {
            event.preventDefault();

            const location = document.getElementById('location').value;
            const date = document.getElementById('date').value;
            const weatherResultsDiv = document.getElementById('weather-results');
            const loadingSpinner = document.getElementById('loading-spinner');

            weatherResultsDiv.innerHTML = '';
            loadingSpinner.classList.remove('d-none');

            const formData = new FormData();
            formData.append('location', location);
            formData.append('date', date);

            try {
                const response = await fetch('/weather', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    let html = `
                        <div class="result-card">
                            <div class="card-header">
                                Weather Data for ${location} on ${date}
                            </div>
                            <ul class="list-group list-group-flush">
                    `;
                    if (data.tmk !== null && data.tmk !== undefined) {
                        html += `<li class="list-group-item"><strong>Mean Temperature:</strong> ${data.tmk.toFixed(2)} °C</li>`;
                    } else {
                        html += `<li class="list-group-item">Mean Temperature data not available.</li>`;
                    }
                    html += `
                            </ul>
                        </div>
                    `;
                    weatherResultsDiv.innerHTML = html;
                } else {
                    weatherResultsDiv.innerHTML = `<div class="alert alert-danger" role="alert">${data.error || 'An error occurred.'}</div>`;
                }
            } catch (error) {
                console.error('Error:', error);
                weatherResultsDiv.innerHTML = `<div class="alert alert-danger" role="alert">An unexpected error occurred.</div>`;
            } finally {
                loadingSpinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
