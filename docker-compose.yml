services:
  db:
    image: postgres:latest
    command: postgres -c log_statement=all
    environment:
      POSTGRES_DB: wetter
      POSTGRES_USER: ttffkk
      POSTGRES_PASSWORD: answer42
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "5432:5432" # Expose PostgreSQL port to host
    networks:
      - app_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - app_network

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=ttffkk
      - DB_PASSWORD=answer42
      - DB_NAME=wetter
    depends_on:
      - db
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge
